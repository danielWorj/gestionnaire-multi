services:
  db:
    image: mysql:8.0
    container_name: gestionnaire-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestionnairedb
      MYSQL_USER: dan
      MYSQL_PASSWORD: dan
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gestionnaire-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: development
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: dan
      DB_PASSWORD: dan
      DB_NAME: gestionnairedb
      SECRET_KEY: change-me-in-production
      JWT_SECRET_KEY: change-me-in-production
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - '5000:5000'
    volumes:
      - ./server:/app

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: gestionnaire-web
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
    ports:
      - '5173:5173'
    volumes:
      - ./web:/app
      - /app/node_modules

volumes:
  mysql-data:
