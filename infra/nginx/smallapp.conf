# nginx de production — smallapp.org, derrière le proxy Cloudflare
# (SSL/TLS "Full (strict)" + certificat Cloudflare Origin).
#
# Certificat/clé attendus dans le conteneur (montés depuis infra/ssl/ du VPS,
# jamais commités — cf. .gitignore) :
#   /etc/nginx/ssl/smallapp.org.pem
#   /etc/nginx/ssl/smallapp.org.key

# --- IP réelle du visiteur (sinon toutes les requêtes viennent de Cloudflare) ---
# Plages officielles : https://www.cloudflare.com/ips/ (à revérifier de temps en temps)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server_tokens off;

upstream api {
    server server:5000;
}

# HTTP -> HTTPS (Cloudflare "Always Use HTTPS" le fait déjà ; filet de sécurité)
server {
    listen 80;
    listen [::]:80;
    server_name smallapp.org www.smallapp.org;
    return 301 https://smallapp.org$request_uri;
}

# www -> domaine nu : les cookies JWT sont posés sur une seule origine
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.smallapp.org;

    ssl_certificate     /etc/nginx/ssl/smallapp.org.pem;
    ssl_certificate_key /etc/nginx/ssl/smallapp.org.key;

    return 301 https://smallapp.org$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name smallapp.org;

    ssl_certificate     /etc/nginx/ssl/smallapp.org.pem;
    ssl_certificate_key /etc/nginx/ssl/smallapp.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Logos d'établissement et imports d'archives (15 Mo par fichier côté
    # API, cf. api/import_api.py) — aligné sur MAX_CONTENT_LENGTH (config.py).
    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- API Flask (gunicorn) ---
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # Génération des bulletins PDF : aligné sur GUNICORN_TIMEOUT
        proxy_read_timeout 130s;
    }

    root /usr/share/nginx/html;

    # Fichiers Vite hashés : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service Worker (mode hors connexion) : jamais mis en cache, sinon le
    # navigateur (ou Cloudflare) garderait une ancienne version de l'appli.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA React (BrowserRouter) : toute route inconnue renvoie index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
